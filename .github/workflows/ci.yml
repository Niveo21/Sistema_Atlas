# CI de Atlas: se ejecuta en cada push a main y en cada pull request.
# Base de datos descartable de CI (no es la de desarrollo ni la de producción).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secretos:
    name: Secretos · gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencias:
    name: Dependencias · npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit · backend
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit · frontend
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  backend:
    name: Backend · esquema y Jest
    needs: [secretos, dependencias]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: atlas_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://atlas:ci_only_password@localhost:5432/atlas_test
      TEST_DATABASE_URL: postgres://atlas:ci_only_password@localhost:5432/atlas_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias
        working-directory: backend
        run: npm ci
      - name: Lint (ESLint)
        working-directory: backend
        run: npm run lint
      - name: Aplicar esquema
        working-directory: backend
        run: npm run db:migrate
      - name: Pruebas Jest con cobertura
        working-directory: backend
        run: npm test -- --coverage
      - name: Mutación (Stryker sobre validación y errores)
        working-directory: backend
        run: npm run test:mutacion
      - name: Análisis SonarCloud
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  frontend:
    name: Frontend · build
    needs: [secretos, dependencias]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      - name: Compilar
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E y accesibilidad
    needs: [secretos, dependencias, backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: atlas_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://atlas:ci_only_password@localhost:5432/atlas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend · dependencias y esquema
        working-directory: backend
        run: |
          npm ci
          npm run db:migrate
      - name: Backend · generar JWT_SECRET de CI
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Backend · levantar en el puerto 4000
        working-directory: backend
        env:
          CORS_ORIGIN: http://localhost:3000
        run: nohup node src/server.js > "$RUNNER_TEMP/backend.log" 2>&1 &
      - name: Frontend · compilar y servir en el puerto 3000
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npm run preview > "$RUNNER_TEMP/frontend.log" 2>&1 &
      - name: Esperar a que respondan ambos servicios
        run: |
          for url in http://localhost:4000 http://localhost:3000/login; do
            for i in $(seq 1 30); do
              if curl -s -o /dev/null "$url"; then break; fi
              sleep 2
            done
          done
      - name: Instalar dependencias de pruebas y Chromium
        working-directory: pruebas-e2e
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
      - name: Sembrar datos de demostración
        working-directory: pruebas-e2e
        run: npm run seed
      - name: Flujo E2E
        working-directory: pruebas-e2e
        run: npm run e2e
      - name: Accesibilidad (axe-core)
        working-directory: pruebas-e2e
        run: npm run a11y
      - name: Logs si algo falla
        if: failure()
        run: |
          echo "--- backend ---"; cat "$RUNNER_TEMP/backend.log" || true
          echo "--- frontend ---"; cat "$RUNNER_TEMP/frontend.log" || true
      - name: Subir capturas de fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-e2e
          path: pruebas-e2e/shots/
          if-no-files-found: ignore
