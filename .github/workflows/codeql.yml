# Análisis estático de seguridad (SAST) con CodeQL para el código JavaScript de Atlas.
# Corre en cada push y pull request a main, y una vez por semana.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analizar:
    name: Análisis CodeQL · JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
