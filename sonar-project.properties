# Configuración de SonarCloud para Atlas. Las claves coinciden con la organización y el proyecto de SonarCloud.
sonar.organization=niveo21-1
sonar.projectKey=Niveo21_Sistema_Atlas
sonar.projectName=Sistema Atlas
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src,frontend/src,db
sonar.tests=backend/tests,pruebas-e2e
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/storage/**,pruebas-e2e/shots/**,**/*.report.html
sonar.coverage.exclusions=backend/tests/**,pruebas-e2e/**,frontend/src/main.jsx

# Cobertura de Jest (backend): se genera con "npm test -- --coverage".
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
